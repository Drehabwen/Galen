schema_version = 1
id = "PCTX03"
name = "研究范围切换与旧范围隔离"
suite = "paired-context"
risk_tier = "high"
prompt = "旧讨论中的既有研究方向全部归档。现在正式研究运动疲劳恢复：协议 GALEN-FATIGUE-01，12 名健康受试者，核心变量 HRV、CMJ、RPE，观察窗 0、24、48、72 小时。生成 output/paired/scope-switch.md，最终内容只使用当前运动疲劳范围。"
timeout_seconds = 240
max_model_requests = 8
max_tool_calls = 6
max_human_interventions = 0

[required]
facts = ["GALEN-FATIGUE-01", "12 名", "HRV", "CMJ", "RPE", "72 小时"]
artifacts = ["output/paired/scope-switch.md"]

[forbidden]
repeated_call_limit = 2
response_patterns = ["脑卒中", "中西医结合", "FMA-UE"]
artifact_patterns = ["脑卒中", "中西医结合", "FMA-UE"]

[context]
variant = "full"
max_tokens = 8000
seed_facts = ["旧研究方向：脑卒中", "中西医结合", "FMA-UE"]
