name: Galen Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - galen-research-workbench
    paths:
      - .github/workflows/galen-windows-release.yml
      - rust/Cargo.lock
      - rust/Cargo.toml
      - rust/crates/galen/**
      - rust/crates/api/**
      - rust/crates/medical-core/**
      - rust/crates/model-router/**
      - rust/crates/runtime/**

permissions:
  contents: write

concurrency:
  group: galen-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm-rust-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/galen-research-workbench'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: galen-windows-release

      - name: Download bundled runtimes
        working-directory: .
        run: python rust/scripts/download_sidecars.py

      - name: Warm Galen release cache
        run: cargo build --release -p galen

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is missing."
          }

          try {
            $decoded = [Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY.Trim())
            )
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY must be the exact base64 text from galen-updater.key, without quotes, code fences, or a file path."
          }

          if (-not $decoded.StartsWith("untrusted comment:")) {
            throw "TAURI_SIGNING_PRIVATE_KEY decoded successfully but is not a Tauri updater private key."
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: galen-windows-release

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rust/crates/galen/package-lock.json

      - name: Install frontend dependencies
        working-directory: rust/crates/galen
        run: npm ci

      - name: Download bundled runtimes
        run: python rust/scripts/download_sidecars.py

      - name: Run frontend tests
        working-directory: rust/crates/galen
        run: npm test

      - name: Build single-file portable Galen
        working-directory: rust
        run: cargo build --release -p galen --features portable-runtime

      - name: Stage portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force rust/dist | Out-Null
          Copy-Item rust/target/release/galen.exe rust/dist/Galen-Portable-x64.exe -Force

      - name: Read Galen version
        id: package-version
        shell: pwsh
        run: |
          $version = (Get-Content rust/crates/galen/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build, sign and publish Galen
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: rust/crates/galen
          tagName: v__VERSION__
          releaseName: Galen v__VERSION__
          releaseBody: |
            Galen 桌面版更新。已安装支持自动更新的版本后，可在应用内直接下载并安装。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Upload portable executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          files: rust/dist/Galen-Portable-x64.exe
          fail_on_unmatched_files: true
