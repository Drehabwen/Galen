<rect x="1087" y="383" width="66" height="28" rx="14" fill="#00856A" stroke="none" stroke-width="1" opacity="1"/>
<text x="1120" y="403" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">缓存</text>
<text x="1089" y="440" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#17372E" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">稳定 L0 前缀</text>
<text x="1089" y="475" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#71827B" font-weight="400" text-anchor="start">
<tspan x="1089" dy="0">人格 + 安全规则字节稳定</tspan>
<tspan x="1089" dy="20.3">模式与任务策略移到尾部</tspan>
</text>
