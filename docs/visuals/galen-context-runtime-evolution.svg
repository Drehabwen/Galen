<tspan x="149" dy="20.3">探索工具定义反复携带</tspan>
</text>
<line x1="430" y1="627" x2="430" y2="657" stroke="#D96C4E" stroke-width="3" marker-end="url(#arrow-coral)"/>
<rect x="125" y="665" width="610" height="112" rx="20" fill="#F6DFD8" stroke="#D96C4E" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<rect x="147" y="683" width="66" height="28" rx="14" fill="#D96C4E" stroke="none" stroke-width="1" opacity="1"/>
