<text x="1089" y="890" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#17372E" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">自适应思考</text>
<text x="1089" y="925" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#71827B" font-weight="400" text-anchor="start">
<tspan x="1089" dy="0">Flash 默认 low</tspan>
<tspan x="1089" dy="20.3">Pro low = 非思考快速通道</tspan>
</text>
<line x1="1370" y1="927" x2="1370" y2="957" stroke="#00856A" stroke-width="3" marker-end="url(#arrow-green)"/>
<rect x="1065" y="965" width="610" height="112" rx="20" fill="#DCEAF0" stroke="#447C92" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<rect x="1087" y="983" width="66" height="28" rx="14" fill="#447C92" stroke="none" stroke-width="1" opacity="1"/>
<text x="1120" y="1003" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">闭环</text>
<text x="1089" y="1040" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#17372E" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">条件续写 + 指标回流</text>
<text x="1089" y="1075" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#71827B" font-weight="400" text-anchor="start">
