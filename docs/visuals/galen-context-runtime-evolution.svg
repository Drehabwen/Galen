<text x="149" y="740" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#17372E" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">默认高思考</text>
<text x="149" y="775" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#71827B" font-weight="400" text-anchor="start">
<tspan x="149" dy="0">Flash / Pro 长 reasoning</tspan>
<tspan x="149" dy="20.3">正式文本迟迟不出现</tspan>
</text>
<line x1="430" y1="777" x2="430" y2="807" stroke="#D96C4E" stroke-width="3" marker-end="url(#arrow-coral)"/>
<rect x="125" y="815" width="610" height="112" rx="20" fill="#F6DFD8" stroke="#D96C4E" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<rect x="147" y="833" width="66" height="28" rx="14" fill="#D96C4E" stroke="none" stroke-width="1" opacity="1"/>
<text x="180" y="853" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">撞墙</text>
<text x="149" y="890" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#17372E" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">硬碰 max_tokens</text>
<text x="149" y="925" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#71827B" font-weight="400" text-anchor="start">
<tspan x="149" dy="0">思考耗尽输出预算</tspan>
<tspan x="149" dy="20.3">reasoning-only → 空回答恢复</tspan>
</text>
<line x1="430" y1="927" x2="430" y2="957" stroke="#D96C4E" stroke-width="3" marker-end="url(#arrow-coral)"/>
<rect x="125" y="965" width="610" height="112" rx="20" fill="#F6DFD8" stroke="#D96C4E" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<rect x="147" y="983" width="66" height="28" rx="14" fill="#D96C4E" stroke="none" stroke-width="1" opacity="1"/>
<text x="180" y="1003" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">重复</text>
<text x="149" y="1040" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#17372E" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">无条件续写</text>
<text x="149" y="1075" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#71827B" font-weight="400" text-anchor="start">
<tspan x="149" dy="0">再次发送完整历史</tspan>
<tspan x="149" dy="20.3">请求与 Token 成倍增加</tspan>
</text>
<rect x="125" y="1125" width="610" height="58" rx="16" fill="#D96C4E" stroke="none" stroke-width="1" opacity="1"/>
<text x="430" y="1163" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#FFFFFF" font-weight="750" text-anchor="middle" letter-spacing="0" opacity="1">结果：91.5s · 7 次请求 · 7,339 输出 Token</text>
<circle cx="900" cy="665" r="50" fill="#00856A" stroke="none" stroke-width="1"/>
<text x="900" y="674" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="34" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">→</text>
<text x="900" y="745" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#00856A" font-weight="750" text-anchor="middle">
<tspan x="900" dy="0">不是换模型</tspan>
<tspan x="900" dy="21.6">而是换调度</tspan>
</text>
<rect x="940" y="220" width="790" height="990" rx="28" fill="#F6FCF9" stroke="#DCEFE8" stroke-width="2" opacity="1"/>
<text x="985" y="270" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#00856A" font-weight="800" text-anchor="start" letter-spacing="2" opacity="1">AFTER</text>
<text x="985" y="312" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="28" fill="#17372E" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">新路径：稳定前缀，动态尾部，有界推理</text>
