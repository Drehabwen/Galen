<rect x="1065" y="1125" width="610" height="58" rx="16" fill="#00856A" stroke="none" stroke-width="1" opacity="1"/>
<text x="1370" y="1163" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#FFFFFF" font-weight="750" text-anchor="middle" letter-spacing="0" opacity="1">结果：52.7s · 5 次请求 · 4,494 输出 Token · 9/9</text>
<text x="80" y="1270" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#71827B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">反馈闭环：探针 → 指标分解 → 找出真正瓶颈 → 修改调度 → 同一质量门复测</text>
