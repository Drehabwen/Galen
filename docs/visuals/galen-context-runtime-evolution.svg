<rect x="1087" y="533" width="66" height="28" rx="14" fill="#00856A" stroke="none" stroke-width="1" opacity="1"/>
<text x="1120" y="553" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">分流</text>
<text x="1089" y="590" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#17372E" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">任务契约路由</text>
<text x="1089" y="625" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#71827B" font-weight="400" text-anchor="start">
<tspan x="1089" dy="0">直接回答 / 定点读写 / 深度讨论</tspan>
<tspan x="1089" dy="20.3">只暴露最小必要工具</tspan>
</text>
<line x1="1370" y1="627" x2="1370" y2="657" stroke="#00856A" stroke-width="3" marker-end="url(#arrow-green)"/>
<rect x="1065" y="665" width="610" height="112" rx="20" fill="#DCEFE8" stroke="#00856A" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<rect x="1087" y="683" width="66" height="28" rx="14" fill="#00856A" stroke="none" stroke-width="1" opacity="1"/>
<text x="1120" y="703" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">连续</text>
<text x="1089" y="740" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#17372E" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">共识与状态尾注入</text>
<text x="1089" y="775" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#71827B" font-weight="400" text-anchor="start">
