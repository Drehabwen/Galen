<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img">
<title>Galen 上下文与推理运行时改造前后</title>
<desc>对比动态系统前缀、长思考和无条件续写的旧流程，与稳定缓存前缀、任务契约、分层思考和有界续写的新流程。</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17372E" flood-opacity="0.08"/></filter>
<marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#00856A"/></marker>
<marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D96C4E"/></marker>
</defs>
<rect width="1800" height="1320" fill="#F4F1EA"/>
<text x="80" y="75" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#00856A" font-weight="700" text-anchor="start" letter-spacing="3" opacity="1">GALEN RUNTIME ARCHITECTURE</text>
<text x="80" y="128" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="44" fill="#17372E" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">上下文与推理调度：改造前 → 改造后</text>
<text x="80" y="170" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#71827B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">相同模型的体验差异，来自请求之前和请求之间的系统设计</text>
<rect x="70" y="220" width="790" height="990" rx="28" fill="#FFF8F5" stroke="#F6DFD8" stroke-width="2" opacity="1"/>
<text x="115" y="270" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#D96C4E" font-weight="800" text-anchor="start" letter-spacing="2" opacity="1">BEFORE</text>
<text x="115" y="312" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="28" fill="#17372E" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">旧路径：信息很多，但每轮都很重</text>
<rect x="125" y="365" width="610" height="112" rx="20" fill="#F6DFD8" stroke="#D96C4E" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<rect x="147" y="383" width="66" height="28" rx="14" fill="#D96C4E" stroke="none" stroke-width="1" opacity="1"/>
<text x="180" y="403" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">动态</text>
<text x="149" y="440" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#17372E" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">动态 System Prompt</text>
<text x="149" y="475" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#71827B" font-weight="400" text-anchor="start">
<tspan x="149" dy="0">任务、模式变化时重写</tspan>
<tspan x="149" dy="20.3">最早前缀容易失配</tspan>
</text>
<line x1="430" y1="477" x2="430" y2="507" stroke="#D96C4E" stroke-width="3" marker-end="url(#arrow-coral)"/>
<rect x="125" y="515" width="610" height="112" rx="20" fill="#F6DFD8" stroke="#D96C4E" stroke-width="2" opacity="1" filter="url(#shadow)"/>
<rect x="147" y="533" width="66" height="28" rx="14" fill="#D96C4E" stroke="none" stroke-width="1" opacity="1"/>
<text x="180" y="553" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">膨胀</text>
<text x="149" y="590" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#17372E" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">大上下文 + 全工具</text>
<text x="149" y="625" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#71827B" font-weight="400" text-anchor="start">
