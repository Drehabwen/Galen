schema_version = 1
id = "E12"
name = "摘要骨架字段覆盖率"
suite = "context-engineering"
risk_tier = "high"
prompt = "根据工作区记忆继续拟定研究方案，生成 output/context-check.md。必须原样保留样本量 48、主要结局 FMA-UE、随机 12 周。"
fixture = "fixtures/e12"
timeout_seconds = 300
max_model_requests = 6
max_tool_calls = 10
max_human_interventions = 0

[context]
variant = "skeleton_only"
preserve_recent = 8
max_tokens = 50000
require_fields = ["- Scope:", "- Current work:", "- Pending work:", "- Key files referenced:", "- Tools mentioned:", "- Recent user requests:", "- Previously compacted context:", "- Newly compacted context:"]

[required]
facts = ["48", "FMA-UE", "12 周"]
artifacts = ["output/context-check.md"]

[forbidden]
repeated_call_limit = 2
response_patterns = ["样本量 28", "主要结局 Barthel"]
