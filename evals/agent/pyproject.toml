[project]
name = "galen-agent-evals"
version = "0.1.0"
description = "External multi-turn evaluation adapters for the Galen rehabilitation research agent"
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["galen_agent_eval*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
